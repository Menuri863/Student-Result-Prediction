<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Result Prediction</title>

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #74ebd5, #9face6);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

.container {
    background: #fffdf5;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    width: 360px;
}

h2 {
    text-align: center;
    color: #333;
    margin-bottom: 25px;
}

label {
    display: block;
    margin-top: 15px;
    font-weight: 600;
    color: #555;
}

.input-box {
    position: relative;
}

.icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 16px;
    color: #6c63ff;
}

input {
    width: 100%;
    padding: 12px 12px 12px 38px;
    margin-top: 5px;
    border: 2px solid #ddd;
    border-radius: 10px;
    box-sizing: border-box;
    transition: 0.3s;
}

input:focus {
    border-color: #6c63ff;
    outline: none;
}

button {
    width: 100%;
    padding: 14px;
    background: #6c63ff;
    color: white;
    border: none;
    border-radius: 10px;
    margin-top: 25px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
}

button:hover {
    background: #5750d8;
}

.result {
    text-align: center;
    margin-top: 25px;
    padding: 10px;
    border-radius: 10px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

    <h2>🎓 Student Result Prediction</h2>

    <form action="/predict" method="POST">

        <label>📊 Attendance (%)</label>
        <div class="input-box">
            <span class="icon">📅</span>
            <input type="text" name="attendance" required>
        </div>

        <label>📝 Assignment Marks</label>
        <div class="input-box">
            <span class="icon">✏️</span>
            <input type="text" name="assignment" required>
        </div>

        <label>❓ Quiz Marks</label>
        <div class="input-box">
            <span class="icon">📋</span>
            <input type="text" name="quiz_marks" required>
        </div>

        <label>📈 Mid Exam Marks</label>
        <div class="input-box">
            <span class="icon">📊</span>
            <input type="text" name="mid_exam" required>
        </div>

        <button type="submit">🔍 Predict</button>
    </form>

    {% if prediction %}
    <div class="result"
        style="background: {{ '#d4edda' if prediction == 'Pass' else '#f8d7da' }};
               color: {{ '#155724' if prediction == 'Pass' else '#721c24' }};
               border: 1px solid {{ '#c3e6cb' if prediction == 'Pass' else '#f5c6cb' }};">
        <h3>✅ Result: {{ prediction }}</h3>
    </div>
    {% endif %}

</div>

</body>
</html>
